name: CI

# NOTE: these were `master`, a branch that does not exist in this repository, so
# CI had NEVER run on any push or pull request. Three defects reached the deployed
# devnet program under that blind spot.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: percolator-stake

      # The e2e suites run the REAL programs under LiteSVM, loading
      # `percolator-stake/target/deploy/percolator_stake.so` and the sibling
      # `percolator-prog/target/deploy/percolator_prog.so`. Both are gitignored
      # build artifacts, so they must be built here or those suites do not
      # exercise the on-chain code at all.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: dcccrypto/percolator-prog
          path: percolator-prog
          # main IS the deployed devnet wrapper. Verified byte-for-byte:
          # percolator-prog@19d5d932 built with `cargo build-sbf -- --features devnet`
          # reproduces DhSkE7uTb8HBUYYWF1xkxMYBGtLYJEoDq1tfBD7SnHcj exactly
          # (sha256 f9056571a2dedfca2ac40235d6d7e85d30bcf10d24c161074d268be1d6cdc802
          # over the 1243192 content bytes; on-chain is that plus 7040 bytes of
          # zero padding). NOT feat/protocol-fee-taker-only — that remote branch is
          # stale, 3 commits BEHIND main, so pinning it tested an older wrapper.
          ref: main
          token: ${{ secrets.PERCOLATOR_PROG_TOKEN || github.token }}

      # percolator-prog has a path dependency on the engine
      # (`percolator = { path = "../percolator" }`), so the wrapper cannot build
      # without it checked out as a sibling.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: dcccrypto/percolator
          path: percolator
          # The engine is the opposite case: its main (d448e1c9) has DIVERGED from
          # what is deployed (3 behind / 15 ahead), and f53be74a on this branch is
          # the engine revision that reproduces the deployed wrapper byte-for-byte.
          # Keep this pinned until the engine's main carries the deployed lineage.
          ref: feat/protocol-fee-taker-only
          token: ${{ secrets.PERCOLATOR_PROG_TOKEN || github.token }}

      - uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c # v1
        with:
          toolchain: stable
          # This action defaults to rustflags: "-D warnings" and exports it as a
          # GLOBAL env var, so it applies to every crate compiled here —
          # including the sibling path dependencies. That made the engine fail to
          # build on an `unused_mut` it has never been required to satisfy
          # (percolator/src/v16.rs:9207), breaking the wrapper .so and this whole
          # job. Deny-warnings for THIS crate is enforced by the Clippy job, which
          # passes -D warnings explicitly; imposing it on other repos' code is not
          # this workflow's business.
          rustflags: ""

      - name: Install Solana CLI (provides cargo-build-sbf)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Build stake BPF program
        working-directory: percolator-stake
        run: cargo build-sbf -- --features devnet

      - name: Build wrapper BPF program
        working-directory: percolator-prog
        # --features devnet is what the DEPLOYED wrapper was built with: it
        # compiles the devnet percolator-stake program id into
        # constants::STAKE_PROGRAM_ID, which tag 87
        # (WithdrawInsuranceReserveToStake) pins its stake-pool owner check and
        # PDA derivations to — precisely the path these e2e suites exercise.
        # Without it the binary is 1237568 bytes instead of the deployed
        # 1243192, i.e. a different program than the one on devnet.
        run: cargo build-sbf -- --features devnet

      # Guard: `common_svm_setup()` in the e2e suites returns None and the test
      # passes VACUOUSLY when either .so is missing — 23 tests across 7 suites
      # behave that way. Fail loudly here instead, so a green run always means
      # those suites really executed.
      - name: Assert both .so artifacts exist
        run: |
          stake_so=percolator-stake/target/deploy/percolator_stake.so
          wrapper_so=percolator-prog/target/deploy/percolator_prog.so
          missing=0
          for f in "$stake_so" "$wrapper_so"; do
            if [ ! -f "$f" ]; then echo "::error::missing $f — e2e suites would silently skip"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1
          ls -l "$stake_so" "$wrapper_so"

      - name: Test
        working-directory: percolator-stake
        run: cargo test --features no-entrypoint --no-fail-fast

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c # v1
        with:
          toolchain: stable
      - run: cargo build --features no-entrypoint

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c # v1
        with:
          toolchain: stable
          components: clippy
      # Library only. `--all-targets` currently reports pre-existing lints in the
      # test suites (large Err variants, argument counts); tightening that is a
      # separate cleanup, not a gate to add mid-flight.
      - run: cargo clippy --features no-entrypoint -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check
